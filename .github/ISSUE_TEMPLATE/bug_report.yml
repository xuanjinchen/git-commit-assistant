name: Bug report
description: Report a reproducible git-commit-assistant defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or private repository content. Report vulnerabilities through the private process in SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest repository state, staged or unstaged changes, prompt, and exact commands that reproduce the issue.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, Node.js version, npm version, Git version, and agent or shell.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include the expected commit message, stop reason, staging behavior, or recovery behavior when relevant.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Include redacted output from relevant validation, such as npm run check, npm run audit, or a focused behavior test.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: List affected operating systems, Node.js versions, Git versions, installed Skill versions, or existing repositories.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive information review
      options:
        - label: I removed credentials, private paths, customer data, logs, and other sensitive information.
          required: true
